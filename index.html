<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>中華民國臺中一中校友總會</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { padding-bottom: 70px; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-gray-800">

  <header class="bg-blue-900 text-white p-3 shadow-md sticky top-0 z-50 flex items-center gap-3">
    <img src="logo2.jpg" alt="校友總會 Logo" class="h-10 w-10 object-contain bg-white rounded-full p-0.5">
    <h1 class="text-[17px] font-bold tracking-wider">中華民國臺中一中校友總會</h1>
  </header>

  <div id="loadingView" class="fixed inset-0 bg-white/80 z-40 flex flex-col items-center justify-center backdrop-blur-sm">
    <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-900 border-t-transparent mb-4"></div>
    <p id="statusMsg" class="text-blue-900 font-bold">系統連線中，請稍候...</p>
  </div>

  <div id="adminModal" class="fixed inset-0 bg-black/60 z-50 hidden flex flex-col items-center justify-center px-4">
    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-sm border-t-4 border-slate-800">
      <h3 class="text-xl font-bold text-slate-800 mb-2">🔐 管理員身分驗證</h3>
      <input type="password" id="adminPwd" class="w-full border p-3 rounded-lg outline-none mb-4" placeholder="請輸入密碼">
      <div class="flex gap-3">
        <button onclick="skipAdmin()" class="w-1/2 bg-gray-200 text-gray-700 font-bold py-2 rounded-lg">跳過</button>
        <button onclick="verifyAdminPwd()" class="w-1/2 bg-slate-800 text-white font-bold py-2 rounded-lg">確認解鎖</button>
      </div>
      <p id="pwdErrorMsg" class="text-red-500 text-sm mt-3 hidden text-center font-bold">❌ 密碼錯誤</p>
    </div>
  </div>

  <div id="eventModal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-md max-h-[90vh] flex flex-col overflow-hidden">
      <div id="modalImageContainer" class="w-full h-48 bg-gray-200 hidden bg-cover bg-center"></div>
      <div class="p-5 overflow-y-auto">
        <div class="flex justify-between items-start mb-2"><span id="modalTarget" class="bg-red-100 text-red-800 text-xs font-bold px-2 py-1 rounded">限定身分</span><button onclick="closeEventModal()" class="text-gray-400 font-bold text-xl leading-none">&times;</button></div>
        <h2 id="modalTitle" class="text-2xl font-bold text-gray-800 mb-3">活動標題</h2>
        <div class="text-sm text-gray-600 space-y-1 mb-4 border-b pb-4"><p>🕒 <span id="modalDate"></span></p><p>📍 <span id="modalLocation"></span></p><p>👥 限定屆數：<span id="modalCohorts" class="font-bold text-blue-700"></span></p></div>
        <div id="modalContent" class="text-gray-700 text-sm leading-relaxed whitespace-pre-wrap mb-4"></div>
      </div>
      <div class="p-4 bg-gray-50 border-t border-gray-200"><button onclick="registerEvent()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg shadow-md transition">🎟️ 我要報名參與</button></div>
    </div>
  </div>

  <div class="max-w-md mx-auto p-4">
    <div id="view-profile" class="view-section hidden">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 mb-4 bg-gradient-to-br from-white to-blue-50">
        <div class="flex justify-between items-center mb-3"><h2 class="text-lg font-bold text-blue-900">校友資訊卡</h2><span id="displayRole" class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded">一般會員(校友)</span></div>
        <div class="space-y-2 text-sm text-gray-700">
          <div class="flex justify-between"><span class="text-gray-500 font-semibold">真實姓名</span><span id="cardName" class="font-bold">尚未設定</span></div>
          <div class="flex justify-between"><span class="text-gray-500 font-semibold">專屬代碼</span><span id="cardUniqueId" class="font-mono font-bold text-blue-700">尚未產生</span></div>
          <div class="flex justify-between"><span class="text-gray-500 font-semibold">聯絡電話</span><span id="cardPhone" class="font-mono">尚未設定</span></div>
          <div class="flex justify-between"><span class="text-gray-500 font-semibold">在學學號</span><span id="cardStudentId" class="font-mono">未提供</span></div>
          <div class="flex justify-between"><span class="text-gray-500 font-semibold">聯絡地址</span><span id="cardAddress" class="text-right w-2/3 truncate">未提供</span></div>
        </div>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-4">
        <h3 class="text-md font-bold text-gray-800 mb-4 border-b pb-2">✏️ 更新會員資料</h3>
        <form class="space-y-4">
          <div class="grid grid-cols-2 gap-4"><div><label class="block text-sm font-semibold text-gray-600 mb-1">真實姓名 <span class="text-red-500">*</span></label><input type="text" id="userName" class="w-full border p-2 rounded-lg outline-none"></div><div><label class="block text-sm font-semibold text-gray-600 mb-1">性別 <span class="text-red-500">*</span></label><select id="userGender" class="w-full border p-2 rounded-lg bg-white"><option value="男">男</option><option value="女">女</option><option value="其他">其他</option></select></div></div>
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">畢業屆數 <span class="text-red-500">*</span></label><select id="userCohort" class="w-full border p-2 rounded-lg bg-white"></select></div>
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">聯絡電話 <span class="text-red-500">*</span></label><input type="tel" id="userPhone" class="w-full border p-2 rounded-lg outline-none"></div>
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">在學學號 <span class="text-xs text-gray-400 font-normal">(選填)</span></label><input type="text" id="userStudentId" class="w-full border p-2 rounded-lg outline-none"></div>
          <button type="button" onclick="saveBasicProfile()" id="saveBasicBtn" class="w-full bg-blue-700 text-white font-bold py-3 rounded-lg mt-2">儲存基本資料</button>
        </form>
      </div>
      <div class="border border-gray-200 rounded-lg overflow-hidden mb-4 shadow-sm bg-white">
        <button type="button" onclick="toggleAdvanced()" class="w-full bg-gray-50 text-gray-700 text-sm font-bold p-4 flex justify-between"><span>➕ 展開填寫進階資料 (選填)</span><span id="advToggleIcon">▼</span></button>
        <div id="advancedFields" class="hidden p-5 space-y-4 border-t border-gray-200">
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">電子信箱</label><input type="email" id="userEmail" class="w-full border p-2 rounded-lg outline-none"></div>
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">聯絡地址</label><input type="text" id="userAddress" class="w-full border p-2 rounded-lg outline-none"></div>
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">服務產業</label><input type="text" id="userIndustry" class="w-full border p-2 rounded-lg outline-none"></div>
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">服務單位</label><input type="text" id="userCompany" class="w-full border p-2 rounded-lg outline-none"></div>
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">職稱</label><input type="text" id="userJobTitle" class="w-full border p-2 rounded-lg outline-none"></div>
          <button type="button" onclick="saveDetailProfile()" id="saveDetailBtn" class="w-full bg-teal-600 text-white font-bold py-3 rounded-lg mt-2">儲存進階詳細資料</button>
        </div>
      </div>
      <button id="claimSuperBtn" onclick="claimSuperAdmin()" class="hidden w-full bg-yellow-600 text-white font-bold py-4 rounded-lg mb-4">👑 註冊初始超級管理員</button>
      <button id="adminEntryBtn" onclick="switchTab('admin')" class="hidden w-full bg-slate-800 text-white font-bold py-3 rounded-lg mb-2">⚙️ 進入系統管理後台</button>
    </div>

    <div id="view-admin" class="view-section hidden">
      <div class="bg-white p-6 rounded-xl border border-slate-200 border-t-4 border-t-slate-800 shadow-sm mb-4">
        <h2 class="text-xl font-bold text-slate-800 mb-4 border-b pb-2">🔍 會員查詢與權限管理</h2>
        <div class="flex gap-2 mb-4"><input type="text" id="searchKeyword" class="w-full border p-3 rounded-lg outline-none" placeholder="輸入姓名或代碼"><button onclick="searchMemberBtn()" class="bg-blue-600 text-white px-5 rounded-lg font-bold">搜尋</button></div>
        <div id="searchResults" class="space-y-3 mt-4 border-t pt-4 hidden"></div>
      </div>
      <div class="bg-white p-6 rounded-xl border border-red-200 border-t-4 border-t-red-700 shadow-sm mb-4">
        <h2 class="text-xl font-bold text-red-800 mb-4 border-b pb-2">📅 建立專屬活動</h2>
        <form id="createEventForm" class="space-y-4">
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">活動主標題 <span class="text-red-500">*</span></label><input type="text" id="evTitle" class="w-full border p-2 rounded-lg" required></div>
          <div class="grid grid-cols-2 gap-3"><div><label class="block text-sm font-semibold text-gray-600 mb-1">日期時間</label><input type="datetime-local" id="evDate" class="w-full border p-2 rounded-lg" required></div><div><label class="block text-sm font-semibold text-gray-600 mb-1">地點</label><input type="text" id="evLoc" class="w-full border p-2 rounded-lg"></div></div>
          <div class="grid grid-cols-2 gap-3"><div><label class="block text-sm font-semibold text-gray-600 mb-1">限定參與身分</label><input type="text" id="evRole" placeholder="例：理監事" class="w-full border p-2 rounded-lg"></div><div><label class="block text-sm font-semibold text-gray-600 mb-1">限定屆數</label><input type="text" id="evCohort" placeholder="例：70-75屆" class="w-full border p-2 rounded-lg"></div></div>
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">內文說明</label><textarea id="evContent" rows="4" class="w-full border p-2 rounded-lg"></textarea></div>
          <div class="bg-red-50 p-3 rounded-lg border border-red-100"><label class="block text-sm text-red-800 mb-1">宣傳圖片 (選傳)</label><input type="file" id="evImage" accept="image/*" class="text-xs"></div>
          <button type="button" onclick="submitCreateEvent()" id="createEventBtn" class="w-full bg-red-700 text-white font-bold py-3 rounded-lg">建立活動與專屬報到表</button>
        </form>
      </div>
    </div>

    <div id="view-events" class="view-section hidden">
      <h2 class="text-xl font-bold text-blue-900 mb-4 px-1 flex justify-between items-center"><span>近期活動預告</span><button onclick="loadEvents()" class="text-sm bg-blue-100 text-blue-800 px-3 py-1 rounded">🔄 重整</button></h2>
      <div id="eventsListContainer" class="space-y-4 pb-4"></div>
    </div>

    <div id="view-checkin" class="view-section hidden"><div class="bg-white p-5 rounded-xl border border-blue-100"><h2 class="text-2xl font-bold mb-5">活動報到</h2><button class="w-full bg-red-600 text-white py-6 rounded-2xl shadow-lg"><span class="text-3xl font-extrabold mb-1">✅ 報到</span></button></div></div>
  </div>

  <nav class="fixed bottom-0 w-full bg-white border-t flex justify-around items-center h-[65px] z-50 pb-2">
    <button onclick="switchTab('profile')" class="flex flex-col items-center justify-center w-1/3 text-blue-700" id="tab-profile"><span class="text-xl mb-1">👤</span><span class="text-[10px] font-bold">會員資料</span></button>
    <button onclick="switchTab('checkin')" class="flex flex-col items-center justify-center w-1/3 text-gray-400" id="tab-checkin"><span class="text-xl mb-1">✅</span><span class="text-[10px] font-bold">活動報到</span></button>
    <button onclick="switchTab('events')" class="flex flex-col items-center justify-center w-1/3 text-gray-400" id="tab-events"><span class="text-xl mb-1">📅</span><span class="text-[10px] font-bold">活動預告</span></button>
  </nav>

  <script src="config.js"></script>
  <script src="member.js"></script>
  <script src="admin.js"></script>
  <script src="event.js"></script>
  <script src="main.js"></script>
  
  <script>
    // 綁定輸入框即時預覽事件 (放在 HTML 底部確保 DOM 已經載入)
    document.getElementById('userCohort').addEventListener('change', updateUniqueIdPreview);
    document.getElementById('userPhone').addEventListener('input', updateUniqueIdPreview);
  </script>
</body>
</html>
