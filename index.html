<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校友會會員系統</title>
  <!-- 載入 Tailwind CSS 框架來美化排版 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 LINE 官方的 LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md text-center">
    <h1 class="text-2xl font-bold mb-4">校友會系統連線測試</h1>
    <p id="statusMsg" class="text-gray-500 mb-4">正在載入 LINE 授權中...</p>
    
    <!-- 顯示使用者的 LINE ID 的區塊 (預設隱藏，成功抓取後顯示) -->
    <div id="profileBox" class="hidden p-4 bg-blue-50 rounded-lg">
      <p class="text-sm text-blue-800 font-bold mb-2">成功抓取您的 LINE ID：</p>
      <p id="userIdDisplay" class="text-xs text-gray-700 break-all"></p>
    </div>
  </div>

  <script>
    // 1. 填入你專屬的 LIFF ID
    const MY_LIFF_ID = "2011351908-6yan9QMs"; 
    
    // 2. 這是你稍早發布的 GAS API 網址 (負責寫入/讀取 Google Sheets)
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyxmqsLVqwOt9TIZdc3nwlq3_JWTijuEgChhBmgasraHTGtxwpoEm2lL_q-QdSIUYW4Wg/exec"; 

    // 初始化 LIFF 應用程式
    async function initializeLiff() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        
        // 檢查使用者是否已登入
        if (liff.isLoggedIn()) {
          getUserProfileAndConnectDatabase();
        } else {
          // 若未登入，強制跳轉至 LINE 登入畫面
          liff.login();
        }
      } catch (err) {
        document.getElementById('statusMsg').innerText = "LIFF 初始化失敗：" + err.message;
      }
    }

    // 取得使用者資料並傳送給 GAS 進行連線測試
    async function getUserProfileAndConnectDatabase() {
      try {
        document.getElementById('statusMsg').innerText = "正在讀取您的資料...";
        
        // 獲取使用者的基本資料
        const profile = await liff.getProfile();
        const lineUserId = profile.userId;

        // 將取得的 LINE ID 顯示在網頁上
        document.getElementById('profileBox').classList.remove('hidden');
        document.getElementById('userIdDisplay').innerText = lineUserId;
        document.getElementById('statusMsg').innerText = "開始與 GAS 資料庫連線...";

        // 使用 fetch 將 LINE ID 以 POST 方式傳遞給你的 GAS API
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'checkUser',
            lineUserId: lineUserId
          })
        });

        const result = await response.json();
        
        // 如果 GAS 成功回傳資料，更新畫面狀態
        if (result.status === 'success') {
          document.getElementById('statusMsg').innerText = "與資料庫連線成功！";
          document.getElementById('statusMsg').classList.add('text-green-600');
        } else {
          document.getElementById('statusMsg').innerText = "連線異常：" + result.message;
        }

      } catch (err) {
        document.getElementById('statusMsg').innerText = "資料庫連線失敗：" + err.message;
      }
    }

    // 網頁完全載入後，立刻執行初始化流程
    window.onload = initializeLiff;
  </script>
</body>
</html>
