<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>中華民國臺中一中校友總會</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { padding-bottom: 70px; }
    @media print {
      body * { visibility: hidden; }
      #view-seating, #view-seating * { visibility: visible; }
      #view-seating { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: white; z-index: 9999; }
      .no-print { display: none !important; }
      #printableSeating { padding: 0; }
      .page-break-avoid { break-inside: avoid; page-break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-gray-800">

  <header class="bg-blue-900 text-white p-3 shadow-md sticky top-0 z-50 flex items-center gap-3 no-print">
    <img src="logo2.jpg" alt="Logo" class="h-10 w-10 object-contain bg-white rounded-full p-0.5 cursor-pointer shadow-sm" onclick="handleSecretDoor()">
    <h1 class="text-[17px] font-bold tracking-wider">中華民國臺中一中校友總會</h1>
  </header>

  <div id="loadingView" class="fixed inset-0 bg-white/80 z-40 flex flex-col items-center justify-center backdrop-blur-md">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-900 border-t-transparent mb-4"></div>
    <p id="statusMsg" class="text-blue-900 font-bold tracking-widest">系統連線中...</p>
  </div>

  <div id="adminModal" class="fixed inset-0 bg-black/60 z-50 hidden flex flex-col items-center justify-center px-4 backdrop-blur-sm">
    <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm border-t-8 border-slate-800">
      <h3 class="text-xl font-bold text-slate-800 mb-2">🔐 管理員身分驗證</h3>
      <input type="password" id="adminPwd" class="w-full border-2 border-gray-200 p-3 rounded-lg outline-none mb-4 focus:border-slate-800 transition" placeholder="請輸入密碼" autocapitalize="off" autocorrect="off">
      <div class="flex gap-3"><button onclick="skipAdmin()" class="w-1/2 bg-gray-200 text-gray-700 font-bold py-2 rounded-lg hover:bg-gray-300">取消</button><button onclick="verifyAdminPwd()" class="w-1/2 bg-slate-800 text-white font-bold py-2 rounded-lg hover:bg-slate-900">解鎖</button></div>
      <p id="pwdErrorMsg" class="text-red-500 text-sm mt-3 hidden text-center font-bold">❌ 密碼錯誤</p>
    </div>
  </div>

  <div id="adminProfileModal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 border-t-8 border-blue-600">
      <div class="flex justify-between items-start mb-4">
        <h3 class="font-bold text-xl text-slate-800">會員詳細履歷</h3>
        <button onclick="document.getElementById('adminProfileModal').classList.add('hidden')" class="text-gray-400 hover:text-gray-600 text-2xl font-bold leading-none">&times;</button>
      </div>
      <div id="adminProfileContent" class="space-y-3 text-sm text-gray-700"></div>
    </div>
  </div>

  <div id="adminEventResultModal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md max-h-[90vh] flex flex-col overflow-hidden border-t-8 border-teal-600">
      <div class="p-6 flex-1 overflow-y-auto">
        <div class="flex justify-between items-start mb-4">
          <h3 class="font-bold text-xl text-teal-800 leading-tight" id="resultModalTitle">活動數據結果</h3>
          <button onclick="document.getElementById('adminEventResultModal').classList.add('hidden')" class="text-gray-400 hover:text-gray-600 text-2xl font-bold leading-none">&times;</button>
        </div>
        <div id="resultModalContent" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <div id="eventModal" class="fixed inset-0 bg-slate-100 z-50 hidden flex flex-col overflow-hidden">
    <div class="bg-white shadow-sm border-b p-3 flex justify-between items-center shrink-0">
       <button onclick="closeEventModal()" class="text-gray-500 font-bold px-2 py-1 flex items-center gap-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> 返回</button>
       <span id="modalTarget" class="bg-red-100 text-red-800 text-xs font-bold px-3 py-1 rounded-full">限定身分</span>
    </div>
    <div class="flex-1 overflow-y-auto p-0 pb-24">
      <div id="modalImageContainer" class="w-full flex overflow-x-auto snap-x hidden bg-gray-900 shrink-0 p-3 gap-3"></div>
      <div class="p-5 bg-white mb-2 shadow-sm">
        <h2 id="modalTitle" class="text-2xl font-black mb-4 text-gray-900 leading-tight">活動標題</h2>
        <div class="text-sm text-gray-600 space-y-2 mb-5">
          <p class="flex items-center gap-2">🕒 <span>時間：<span id="modalDate" class="font-semibold text-gray-800"></span></span></p>
          <p class="flex items-center gap-2">📍 <span>地點：<span id="modalLocation" class="font-semibold text-gray-800"></span></span></p>
          <p class="flex items-center gap-2">👥 <span>限定屆數：<span id="modalCohorts" class="font-bold text-blue-700"></span></span></p>
          <p class="flex items-center gap-2 text-red-600 font-bold bg-red-50 p-2 rounded-lg">⏳ <span id="modalDeadlineLabel">截止日期：</span><span id="modalDeadline"></span></p>
        </div>
        <div id="modalContent" class="text-gray-700 text-sm whitespace-pre-wrap leading-relaxed"></div>
      </div>
      
      <div id="eventExtraInputs" class="mb-4 mx-4 space-y-4 bg-white p-5 rounded-2xl border border-gray-100 shadow-sm">
        <div><label class="block text-sm font-bold text-gray-800 mb-2">參加人數</label><input type="number" id="evAttendeeCount" min="1" value="1" class="w-full border-2 border-gray-200 p-3 rounded-xl outline-none focus:border-blue-500 transition font-bold text-lg text-center"></div>
        <div><label class="block text-sm font-bold text-gray-800 mb-2">匯款帳號末 5 碼 <span class="text-xs text-gray-400 font-normal">(若需繳費)</span></label><input type="text" id="evPaymentDigits" maxlength="5" placeholder="無則免填" class="w-full border-2 border-gray-200 p-3 rounded-xl outline-none focus:border-blue-500 transition font-mono text-center tracking-widest text-lg"></div>
      </div>

      <div id="modalVotingSection" class="hidden px-4 mb-4">
        <div id="votingOptionsList" class="space-y-4"></div>
      </div>
    </div>
    <div class="absolute bottom-0 w-full p-4 bg-white border-t border-gray-200 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] pb-8" id="modalActionFooter">
      <button id="registerEvtBtn" onclick="submitUserAction()" class="w-full bg-red-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-red-700 transition active:scale-95 text-lg">🎟️ 我要報名 / 送出</button>
      <p id="voteNotice" class="text-[11px] text-gray-400 text-center mt-3 font-bold hidden">💡 再次送出將會覆蓋舊選擇。</p>
    </div>
  </div>

  <div class="max-w-md mx-auto p-4 no-print">
    <div id="view-profile" class="view-section hidden">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-4 bg-gradient-to-br from-white to-blue-50/50 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-24 h-24 bg-blue-100 rounded-bl-full opacity-50 -z-10"></div>
        <div class="flex justify-between items-center mb-4"><h2 class="text-lg font-black text-blue-900">校友資訊卡</h2><span id="displayRole" class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full shadow-sm">一般會員(校友)</span></div>
        <div class="space-y-3 text-sm text-gray-700">
          <div class="flex justify-between items-center border-b border-gray-100 pb-2"><span class="text-gray-400 font-bold">真實姓名</span><span id="cardName" class="font-bold text-gray-900">尚未設定</span></div>
          <div class="flex justify-between items-center border-b border-gray-100 pb-2"><span class="text-gray-400 font-bold">專屬代碼</span><span id="cardUniqueId" class="font-mono font-black text-blue-700 bg-blue-50 px-2 py-0.5 rounded">尚未產生</span></div>
          <div class="flex justify-between items-center border-b border-gray-100 pb-2"><span class="text-gray-400 font-bold">聯絡電話</span><span id="cardPhone" class="font-mono font-bold text-gray-900">尚未設定</span></div>
          <div class="flex justify-between items-center border-b border-gray-100 pb-2"><span class="text-gray-400 font-bold">在學學號</span><span id="cardStudentId" class="font-mono font-bold text-gray-900">未提供</span></div>
          <div class="flex justify-between items-center"><span class="text-gray-400 font-bold whitespace-nowrap">聯絡地址</span><span id="cardAddress" class="text-right w-2/3 truncate font-bold text-gray-900">未提供</span></div>
        </div>
      </div>
      
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-4">
        <h3 class="text-md font-bold text-gray-800 mb-4 flex items-center gap-2"><span class="bg-blue-100 p-1.5 rounded-lg text-blue-700">✏️</span> 更新會員資料</h3>
        <form class="space-y-4">
          <div class="grid grid-cols-2 gap-4"><div><label class="block text-xs font-bold text-gray-500 mb-1 ml-1">真實姓名 *</label><input type="text" id="userName" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none focus:bg-white focus:border-blue-400 transition font-bold text-gray-800"></div><div><label class="block text-xs font-bold text-gray-500 mb-1 ml-1">性別 *</label><select id="userGender" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none focus:bg-white focus:border-blue-400 transition font-bold text-gray-800"><option value="男">男</option><option value="女">女</option><option value="其他">其他</option></select></div></div>
          <div><label class="block text-xs font-bold text-gray-500 mb-1 ml-1">畢業屆數 *</label><select id="userCohort" onchange="updateUniqueIdPreview()" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none focus:bg-white focus:border-blue-400 transition font-bold text-gray-800"></select></div>
          <div><label class="block text-xs font-bold text-gray-500 mb-1 ml-1">聯絡電話 *</label><input type="tel" id="userPhone" oninput="updateUniqueIdPreview()" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none focus:bg-white focus:border-blue-400 transition font-bold text-gray-800"></div>
          <div><label class="block text-xs font-bold text-gray-500 mb-1 ml-1">在學學號</label><input type="text" id="userStudentId" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none focus:bg-white focus:border-blue-400 transition font-bold text-gray-800"></div>
          <button type="button" onclick="saveBasicProfile()" id="saveBasicBtn" class="w-full bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md hover:bg-blue-800 transition active:scale-95 mt-2 text-lg">💾 儲存基本資料</button>
        </form>
      </div>

      <div class="border border-gray-100 rounded-2xl overflow-hidden mb-4 shadow-sm bg-white">
        <button type="button" onclick="toggleAdvanced()" class="w-full bg-gray-50 font-bold p-5 flex justify-between items-center hover:bg-gray-100 transition"><span class="text-gray-700">➕ 展開進階資料</span><span id="advToggleIcon" class="text-gray-400">▼</span></button>
        <div id="advancedFields" class="hidden p-6 space-y-4 border-t border-gray-100">
          <div><label class="block text-xs font-bold text-gray-500 mb-1 ml-1">電子信箱</label><input type="email" id="userEmail" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none focus:bg-white focus:border-teal-400 transition font-bold text-gray-800"></div>
          <div><label class="block text-xs font-bold text-gray-500 mb-1 ml-1">聯絡地址</label><input type="text" id="userAddress" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none focus:bg-white focus:border-teal-400 transition font-bold text-gray-800"></div>
          <div><label class="block text-xs font-bold text-gray-500 mb-1 ml-1">服務產業</label><input type="text" id="userIndustry" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none focus:bg-white focus:border-teal-400 transition font-bold text-gray-800"></div>
          <div><label class="block text-xs font-bold text-gray-500 mb-1 ml-1">服務單位</label><input type="text" id="userCompany" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none focus:bg-white focus:border-teal-400 transition font-bold text-gray-800"></div>
          <div><label class="block text-xs font-bold text-gray-500 mb-1 ml-1">職稱</label><input type="text" id="userJobTitle" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none focus:bg-white focus:border-teal-400 transition font-bold text-gray-800"></div>
          <button type="button" onclick="saveDetailProfile()" id="saveDetailBtn" class="w-full bg-teal-600 text-white font-bold py-4 rounded-xl shadow-md hover:bg-teal-700 transition active:scale-95 mt-2 text-lg">💾 儲存進階資料</button>
        </div>
      </div>
      
      <button id="claimAdminBtn" onclick="claimAdmin()" class="hidden w-full bg-yellow-600 text-white font-bold py-4 rounded-xl shadow-md mb-4 text-lg">👑 成為首位系統管理員</button>
      <button id="adminEntryBtn" onclick="promptAdminModal()" class="hidden w-full bg-slate-800 text-white font-bold py-4 rounded-xl shadow-md hover:bg-slate-900 transition active:scale-95 mb-4 text-lg border-b-4 border-slate-900">⚙️ 進入系統管理後台</button>
    </div>

    <!-- 視圖 2：系統管理後台 -->
    <div id="view-admin" class="view-section hidden">
      <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm mb-4">
        <h2 class="text-xl font-black mb-4 flex items-center gap-2"><span class="bg-blue-100 p-1.5 rounded-lg text-blue-700">🔍</span> 會員查詢與權限</h2>
        <div class="flex gap-2 mb-3">
          <input type="text" id="searchKeyword" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none flex-1 focus:bg-white focus:border-blue-400 transition font-bold text-gray-800" placeholder="姓名或代碼">
          <button onclick="searchMemberBtn()" class="bg-blue-600 text-white px-5 rounded-xl font-bold hover:bg-blue-700 shadow-sm transition">搜尋</button>
        </div>
        <div class="flex gap-2 mb-2">
          <select id="searchCohort" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none flex-1 focus:bg-white focus:border-blue-400 transition font-bold text-gray-800"></select>
          <button onclick="searchByCohortBtn()" class="bg-blue-800 text-white px-5 rounded-xl font-bold text-sm hover:bg-blue-900 shadow-sm transition">依屆次</button>
        </div>
        <div id="searchResults" class="space-y-3 mt-4 hidden"></div>
      </div>

      <div class="bg-white p-6 rounded-2xl border border-slate-100 mb-4 shadow-sm">
        <h2 class="text-xl font-black text-slate-800 mb-4 flex items-center gap-2"><span class="bg-indigo-100 p-1.5 rounded-lg text-indigo-700">📋</span> 既有活動管理</h2>
        <button onclick="loadAdminEvents()" class="w-full bg-indigo-50 text-indigo-800 font-bold py-3 rounded-xl hover:bg-indigo-100 transition mb-4">載入/重整 活動列表</button>
        <div id="adminEventsContainer" class="space-y-4"></div>
      </div>

      <div class="bg-white p-6 rounded-2xl border border-red-100 shadow-sm mb-4">
        <h2 class="text-xl font-black text-red-800 mb-4 flex items-center gap-2"><span class="bg-red-100 p-1.5 rounded-lg text-red-700">📅</span> 建立專屬活動</h2>
        <form id="createEventForm" class="space-y-4">
          <div><label class="block text-xs font-bold text-gray-500 mb-1 ml-1">主標題 *</label><input type="text" id="evTitle" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none focus:bg-white focus:border-red-400 transition font-bold text-gray-800" required></div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1 ml-1">活動類型 *</label>
              <select id="evType" onchange="toggleAdminVotingSection()" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none focus:bg-white focus:border-red-400 transition font-bold text-gray-800">
                <option value="一般活動">一般活動</option>
                <option value="聚餐">聚餐</option>
                <option value="演講">演講</option>
                <option value="進階問卷">📝 進階問卷/投票</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div><label class="block text-xs font-bold text-gray-500 mb-1 ml-1">日期時間</label><input type="datetime-local" id="evDate" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none focus:bg-white focus:border-red-400 transition font-bold text-gray-800" required></div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="block text-xs font-bold text-gray-500 mb-1 ml-1">報名/投票截止日</label><input type="datetime-local" id="evDeadline" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none focus:bg-white focus:border-red-400 transition font-bold text-gray-800"></div>
            <div><label class="block text-xs font-bold text-gray-500 mb-1 ml-1">地點</label><input type="text" id="evLoc" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none focus:bg-white focus:border-red-400 transition font-bold text-gray-800"></div>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1 ml-1">限定身分 *</label>
            <select id="evRole" onchange="toggleRoleInput()" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none focus:bg-white focus:border-red-400 transition font-bold text-gray-800">
              <option value="全體">全體</option><option value="限定屆數">限定屆數</option><option value="校友會成員">校友會成員</option>
            </select>
          </div>
          <div id="cohortInputDiv" class="hidden"><label class="block text-xs font-bold text-gray-500 mb-1 ml-1">輸入屆數 (例: 70-75)</label><input type="text" id="evCohort" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none focus:bg-white focus:border-red-400 transition font-bold text-gray-800"></div>
          <div><label class="block text-xs font-bold text-gray-500 mb-1 ml-1">內文說明</label><textarea id="evContent" rows="4" class="w-full border-2 border-gray-100 bg-gray-50 p-3 rounded-xl outline-none focus:bg-white focus:border-red-400 transition font-bold text-gray-800"></textarea></div>
          <div class="bg-red-50/50 p-4 rounded-xl border border-red-100">
            <div class="flex justify-between items-center mb-3"><label class="block text-sm font-bold text-red-800">主視覺宣傳圖</label><button type="button" onclick="document.getElementById('evImageInput').click()" class="bg-white border border-red-200 text-red-600 text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm hover:bg-red-50 transition">+ 添加照片</button></div>
            <input type="file" id="evImageInput" accept="image/*" multiple class="hidden" onchange="handleImagePreview(event)">
            <div id="imagePreviewContainer" class="flex gap-3 overflow-x-auto snap-x py-2 hidden mt-2"></div>
          </div>
          <div id="adminVotingSection" class="hidden bg-purple-50/50 p-5 rounded-2xl border border-purple-100">
            <div class="flex justify-between items-center mb-4"><h3 class="font-black text-purple-900 text-lg flex items-center gap-2"><span class="bg-purple-200 p-1.5 rounded-lg text-purple-700">📝</span> 表單問卷設計</h3><button type="button" onclick="addVotingOptionUI()" class="bg-purple-600 text-white text-xs font-bold px-4 py-2 rounded-lg shadow-md hover:bg-purple-700 transition active:scale-95">+ 新增題目</button></div>
            <div id="votingOptionsContainer" class="space-y-5"></div>
          </div>
          <button type="button" onclick="submitCreateEvent()" id="createEventBtn" class="w-full bg-red-700 text-white font-bold py-4 rounded-xl shadow-lg mt-4 text-lg hover:bg-red-800 transition active:scale-95 border-b-4 border-red-900">極速建立活動</button>
        </form>
      </div>
    </div>

    <!-- 視圖 3：活動預告 -->
    <div id="view-events" class="view-section hidden">
      <div class="flex justify-between items-center mb-5 px-2">
        <h2 class="text-2xl font-black text-blue-900">近期活動</h2>
        <button onclick="loadEvents()" class="text-sm bg-white border border-gray-200 shadow-sm text-gray-600 px-4 py-1.5 rounded-full font-bold hover:bg-gray-50 active:scale-95 transition">🔄 重新整理</button>
      </div>
      <div id="eventsListContainer" class="space-y-5 pb-4"></div>
    </div>

    <!-- 視圖 4：報到 -->
    <div id="view-checkin" class="view-section hidden">
      <div class="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm text-center flex flex-col items-center justify-center min-h-[50vh]">
        <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-4xl mb-4">✅</div>
        <h2 class="text-2xl font-black mb-6 text-gray-800">快速活動報到</h2>
        <button class="w-full bg-green-500 hover:bg-green-600 transition text-white py-5 rounded-2xl shadow-[0_8px_0_0_#16a34a] active:translate-y-2 active:shadow-none font-black text-2xl tracking-widest">掃描報到</button>
      </div>
    </div>
  </div>

  <div id="view-seating" class="view-section hidden w-full bg-white min-h-screen z-50 fixed top-0 left-0 overflow-y-auto pb-20">
    <div class="sticky top-0 bg-white border-b shadow-sm p-3 flex justify-between items-center no-print">
