<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>中華民國臺中一中校友總會</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { padding-bottom: 70px; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-gray-800 selection:bg-blue-200">

  <!-- 頂部 Header -->
  <header class="bg-blue-900 text-white p-3 shadow-md sticky top-0 z-50 flex items-center gap-3">
    <img src="logo2.jpg" alt="校友總會 Logo" class="h-10 w-10 object-contain bg-white rounded-full p-0.5">
    <h1 class="text-[17px] font-bold tracking-wider">中華民國臺中一中校友總會</h1>
  </header>

  <div id="loadingView" class="fixed inset-0 bg-white/80 z-40 flex flex-col items-center justify-center backdrop-blur-sm">
    <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-900 border-t-transparent mb-4"></div>
    <p id="statusMsg" class="text-blue-900 font-bold">系統連線中，請稍候...</p>
  </div>

  <!-- 管理員密碼驗證彈窗 -->
  <div id="adminModal" class="fixed inset-0 bg-black/60 z-50 hidden flex flex-col items-center justify-center backdrop-blur-sm px-4">
    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-sm border-t-4 border-slate-800">
      <h3 class="text-xl font-bold text-slate-800 mb-2">🔐 管理員身分驗證</h3>
      <p class="text-sm text-gray-600 mb-4">系統偵測到您具有管理員權限。<br>請輸入密碼以解鎖後台功能，或跳過以使用一般會員介面。</p>
      <input type="password" id="adminPwd" class="w-full border border-gray-300 p-3 rounded-lg outline-none mb-4" placeholder="請輸入密碼">
      <div class="flex gap-3">
        <button onclick="skipAdmin()" class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 rounded-lg transition">跳過</button>
        <button onclick="verifyAdminPwd()" class="w-1/2 bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 rounded-lg transition">確認解鎖</button>
      </div>
      <p id="pwdErrorMsg" class="text-red-500 text-sm mt-3 hidden text-center font-bold">❌ 密碼錯誤，請重新輸入</p>
    </div>
  </div>

  <div class="max-w-md mx-auto p-4">

    <!-- 視圖 1：校友及會員資料 -->
    <div id="view-profile" class="view-section hidden">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-4">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
          <h2 class="text-xl font-bold text-blue-900">校友及會員資料</h2>
          <span id="displayRole" class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded">一般會員(校友)</span>
        </div>
        
        <form id="memberForm" class="space-y-4">
          <!-- 專屬代碼顯示區 (唯讀) -->
          <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
            <label class="block text-xs font-bold text-gray-500 mb-1">您的專屬身分代碼 (屆數-電話)</label>
            <div id="displayUniqueId" class="text-lg font-mono font-bold text-slate-700 tracking-wider">尚未產生</div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1">真實姓名</label>
            <input type="text" id="userName" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="請輸入姓名">
          </div>
          
          <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1">畢業屆數</label>
            <select id="userCohort" onchange="updateUniqueIdPreview()" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
              <option value="" disabled selected>請選擇畢業屆數...</option>
              <!-- 選項將由 JS 動態生成 -->
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1">聯絡電話</label>
            <input type="tel" id="userPhone" oninput="updateUniqueIdPreview()" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="例如：0912345678">
          </div>
          
          <button type="button" onclick="saveProfile()" id="saveProfileBtn" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-lg shadow transition">儲存 / 更新資料</button>
        </form>
      </div>
      
      <button id="adminEntryBtn" onclick="switchTab('admin')" class="hidden w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-lg shadow flex items-center justify-center gap-2">
        ⚙️ 進入管理員後台
      </button>
    </div>

    <!-- 視圖 2：管理員後台 -->
    <div id="view-admin" class="view-section hidden">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 border-t-4 border-t-slate-800">
        <h2 class="text-xl font-bold text-slate-800 mb-4 border-b pb-2">⚙️ 建立新活動</h2>
        <form class="space-y-4">
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">活動日期</label><input type="date" id="eventDate" class="w-full border p-2 rounded-lg"></div>
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">活動標題</label><input type="text" id="eventTitle" class="w-full border p-2 rounded-lg"></div>
          <button type="button" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-lg transition">建立資料夾與報到表</button>
        </form>
      </div>
    </div>

    <!-- 視圖 3 & 4 (保持空白結構以利測試) -->
    <div id="view-checkin" class="view-section hidden"><div class="bg-white p-5 rounded-xl border border-blue-100"><h2 class="text-2xl font-bold mb-5">活動報到</h2><button class="w-full bg-red-600 text-white py-6 rounded-2xl"><span class="text-3xl font-extrabold mb-1">✅ 報到</span></button></div></div>
    <div id="view-events" class="view-section hidden"><h2 class="text-xl font-bold text-blue-900 mb-4 px-1">活動預告</h2></div>

  </div>

  <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center h-[65px] z-50 pb-2">
    <button onclick="switchTab('profile')" class="flex flex-col items-center justify-center w-1/3 text-blue-700" id="tab-profile"><span class="text-xl mb-1">👤</span><span class="text-[10px] font-bold">會員資料</span></button>
    <button onclick="switchTab('checkin')" class="flex flex-col items-center justify-center w-1/3 text-gray-400" id="tab-checkin"><span class="text-xl mb-1">✅</span><span class="text-[10px] font-bold">活動報到</span></button>
    <button onclick="switchTab('events')" class="flex flex-col items-center justify-center w-1/3 text-gray-400" id="tab-events"><span class="text-xl mb-1">📅</span><span class="text-[10px] font-bold">活動預告</span></button>
  </nav>

  <script>
    const MY_LIFF_ID = "2011351908-6yan9QMs"; 
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyxmqsLVqwOt9TIZdc3nwlq3_JWTijuEgChhBmgasraHTGtxwpoEm2lL_q-QdSIUYW4Wg/exec"; 
    let currentUserLineId = "";

    // 1. 動態生成 1 到 120 屆的下拉選單
    function generateCohortOptions() {
      const select = document.getElementById('userCohort');
      for (let i = 1; i <= 120; i++) {
        const option = document.createElement('option');
        option.value = i;
        option.text = `第 ${i} 屆`;
        select.appendChild(option);
      }
    }

    // 2. 即時預覽專屬代碼
    function updateUniqueIdPreview() {
      const cohort = document.getElementById('userCohort').value;
      const phone = document.getElementById('userPhone').value;
      const display = document.getElementById('displayUniqueId');
      
      if (cohort && phone) {
        display.innerText = `${cohort}-${phone}`;
        display.classList.remove('text-slate-700');
        display.classList.add('text-blue-700');
      } else {
        display.innerText = "尚未產生";
        display.classList.remove('text-blue-700');
        display.classList.add('text-slate-700');
      }
    }

    async function initializeApp() {
      try {
        generateCohortOptions(); // 載入屆數選項
        await liff.init({ liffId: MY_LIFF_ID });
        
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          currentUserLineId = profile.userId;
          checkUserData(currentUserLineId);
        } else {
          liff.login();
        }
      } catch (err) {
        document.getElementById('statusMsg').innerText = "系統初始化失敗：" + err.message;
      }
    }

    // 呼叫 GAS 檢查身分與載入資料
    async function checkUserData(lineId) {
      document.getElementById('statusMsg').innerText = "正在讀取您的資料...";
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'checkUser', lineUserId: lineId })
        });
        const result = await response.json();
        document.getElementById('loadingView').classList.add('hidden');
        
        // 如果資料庫已有此人資料，自動填入表單
        if (result.profile) {
          document.getElementById('userName').value = result.profile.name;
          document.getElementById('userCohort').value = result.profile.cohort;
          document.getElementById('userPhone').value = result.profile.phone;
          document.getElementById('displayRole').innerText = result.profile.role;
          updateUniqueIdPreview(); // 更新代碼顯示
        }
        
        // 管理員權限判定
        if (result.status === 'success' && result.isAdmin) {
          document.getElementById('adminModal').classList.remove('hidden');
        } else {
          switchTab('profile');
        }
      } catch (err) {
        document.getElementById('loadingView').classList.add('hidden');
        switchTab('profile');
      }
    }

    // 儲存會員資料
    async function saveProfile() {
      const name = document.getElementById('userName').value;
      const cohort = document.getElementById('userCohort').value;
      const phone = document.getElementById('userPhone').value;
      const btn = document.getElementById('saveProfileBtn');

      if (!name || !cohort || !phone) {
        alert("請完整填寫姓名、畢業屆數與聯絡電話。");
        return;
      }

      btn.disabled = true;
      btn.innerText = "資料儲存中...";

      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'saveProfile',
            lineUserId: currentUserLineId,
            name: name,
            cohort: cohort,
            phone: phone
          })
        });
        const result = await response.json();
        
        if (result.status === 'success') {
          alert(`✅ 資料儲存成功！\n您的專屬代碼為：${result.uniqueId}`);
        } else {
          throw new Error(result.message);
        }
      } catch (error) {
        alert("❌ 儲存失敗，請重試。");
      } finally {
        btn.disabled = false;
        btn.innerText = "儲存 / 更新資料";
      }
    }

    // 密碼與 Tab 切換邏輯 (與前次相同)
    function verifyAdminPwd() {
      if (document.getElementById('adminPwd').value === "tcfsh01") {
        document.getElementById('adminModal').classList.add('hidden');
        document.getElementById('adminEntryBtn').classList.remove('hidden');
        switchTab('admin');
      } else {
        document.getElementById('pwdErrorMsg').classList.remove('hidden');
      }
    }
    function skipAdmin() { document.getElementById('adminModal').classList.add('hidden'); switchTab('profile'); }
    function switchTab(tabName) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
      document.getElementById(`view-${tabName}`).classList.remove('hidden');
      ['profile', 'checkin', 'events'].forEach(id => {
        const btn = document.getElementById(`tab-${id}`);
        if(btn) btn.classList.replace(id === tabName || (id === 'profile' && tabName === 'admin') ? 'text-gray-400' : 'text-blue-700', id === tabName || (id === 'profile' && tabName === 'admin') ? 'text-blue-700' : 'text-gray-400');
      });
    }

    window.onload = initializeApp;
  </script>
</body>
</html>
