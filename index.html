<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>中華民國臺中一中校友總會</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    /* 隱藏捲軸但允許滾動，提升 App 質感 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* 確保底部導覽列不會遮擋內容 */
    body { padding-bottom: 70px; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-gray-800 selection:bg-blue-200">

  <!-- 頂部 Header：Logo 與全稱 -->
  <header class="bg-blue-900 text-white p-3 shadow-md sticky top-0 z-50 flex items-center gap-3">
    <!-- 確保 logo2.jpg 與 index.html 放在 GitHub 的同一個資料夾下 -->
    <img src="logo2.jpg" alt="校友總會 Logo" class="h-10 w-10 object-contain bg-white rounded-full p-0.5">
    <h1 class="text-[17px] font-bold tracking-wider">中華民國臺中一中校友總會</h1>
  </header>

  <!-- 狀態提示區 -->
  <div id="loadingView" class="fixed inset-0 bg-white/80 z-40 flex flex-col items-center justify-center backdrop-blur-sm">
    <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-900 border-t-transparent mb-4"></div>
    <p id="statusMsg" class="text-blue-900 font-bold">系統連線中，請稍候...</p>
  </div>

  <div class="max-w-md mx-auto p-4">

    <!-- 視圖 1：校友及會員資料 -->
    <div id="view-profile" class="view-section hidden">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-xl font-bold text-blue-900 mb-4 border-b pb-2">校友及會員資料</h2>
        
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-600 mb-1">LINE 綁定狀態</label>
          <div class="text-xs text-green-700 bg-green-50 p-2 rounded border border-green-200 font-mono break-all" id="userIdDisplay">尚未獲取</div>
        </div>

        <form id="memberForm" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1">真實姓名</label>
            <input type="text" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="請輸入姓名">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1">畢業屆數 (數字)</label>
            <input type="number" id="userCohort" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="例如：84">
            <p class="text-xs text-gray-400 mt-1">此欄位將影響特定活動的報到權限</p>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1">聯絡電話</label>
            <input type="tel" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="09XX-XXX-XXX">
          </div>
          <button type="button" onclick="saveProfile()" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-lg shadow transition">
            儲存 / 更新資料
          </button>
        </form>
      </div>
    </div>

    <!-- 視圖 2：活動報到 -->
    <div id="view-checkin" class="view-section hidden space-y-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-blue-100">
        <div class="flex items-center gap-2 mb-2">
          <span class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold">進行中活動</span>
        </div>
        <h2 id="activeEventTitle" class="text-2xl font-bold text-gray-800 mb-1">載入中...</h2>
        <p id="activeEventDate" class="text-sm text-gray-500 mb-5">載入中...</p>
        
        <!-- 報到專用大按鈕 -->
        <button onclick="handleCheckIn()" class="w-full bg-red-600 hover:bg-red-700 text-white py-6 px-4 rounded-2xl shadow-lg border-4 border-red-200 flex flex-col items-center justify-center transition transform active:scale-95">
          <span class="text-3xl font-extrabold mb-1 tracking-wide">✅ 活動報到</span>
          <span class="text-[10px] font-normal opacity-90">(請由工作人員操作，請勿自行隨意點擊，避免影響權利)</span>
        </button>
      </div>

      <!-- 其他活動列表 (僅標題) -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
        <h3 class="text-sm font-bold text-gray-600 mb-3">其他近期活動</h3>
        <ul id="otherEventsList" class="space-y-2 divide-y divide-gray-100">
          <!-- 動態生成 -->
        </ul>
      </div>
    </div>

    <!-- 視圖 3：活動預告 -->
    <div id="view-events" class="view-section hidden">
      <h2 class="text-xl font-bold text-blue-900 mb-4 px-1">活動預告與細則</h2>
      <div id="eventsContainer" class="space-y-4">
        <!-- 活動卡片將由 JavaScript 動態生成 -->
      </div>
    </div>

  </div>

  <!-- 底部 App 風格導覽列 -->
  <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center h-[65px] z-50 pb-2">
    <button onclick="switchTab('profile')" class="flex flex-col items-center justify-center w-1/3 text-gray-400 hover:text-blue-700 focus:outline-none" id="tab-profile">
      <span class="text-xl mb-1">👤</span>
      <span class="text-[10px] font-bold">會員資料</span>
    </button>
    <button onclick="switchTab('checkin')" class="flex flex-col items-center justify-center w-1/3 text-blue-700 focus:outline-none" id="tab-checkin">
      <span class="text-xl mb-1">✅</span>
      <span class="text-[10px] font-bold">活動報到</span>
    </button>
    <button onclick="switchTab('events')" class="flex flex-col items-center justify-center w-1/3 text-gray-400 hover:text-blue-700 focus:outline-none" id="tab-events">
      <span class="text-xl mb-1">📅</span>
      <span class="text-[10px] font-bold">活動預告</span>
    </button>
  </nav>

  <script>
    // ⚠️ 系統參數
    const MY_LIFF_ID = "2011351908-6yan9QMs"; 
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyxmqsLVqwOt9TIZdc3nwlq3_JWTijuEgChhBmgasraHTGtxwpoEm2lL_q-QdSIUYW4Wg/exec"; 
    let currentUserLineId = "";

    // 模擬未來從 GAS 後台抓取的活動資料庫 (Mock Data)
    const EVENTS_DB = [
      {
        id: "evt_001",
        title: "2026 校友總會年度大會暨晚宴",
        date: "2026-10-18 18:00",
        location: "台中市某大飯店",
        description: "年度最重要的校友聚會，備有精緻餐點與摸彩活動。歡迎各屆校友共襄盛舉。",
        targetCohorts: "all", // all 代表全體皆可
        isActive: true // true 代表這是目前可供報到的最新活動
      },
      {
        id: "evt_002",
        title: "在校生升學經驗傳承分享會",
        date: "2026-11-05 14:00",
        location: "臺中一中大禮堂",
        description: "邀請近期畢業的學長姐回母校分享升學與職涯規劃。僅限第 80-86 屆學長姐與在校生報名參加。",
        targetCohorts: [80, 81, 82, 83, 84, 85, 86], // 陣列代表特定屆數才能報到
        isActive: false
      }
    ];

    // 初始化應用程式
    async function initializeApp() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          currentUserLineId = profile.userId;
          document.getElementById('userIdDisplay').innerText = currentUserLineId;
          
          // 隱藏讀取畫面，預設顯示「活動報到」頁面
          document.getElementById('loadingView').classList.add('hidden');
          renderEventsData();
          switchTab('checkin');
        } else {
          liff.login();
        }
      } catch (err) {
        document.getElementById('statusMsg').innerText = "系統初始化失敗：" + err.message;
        document.getElementById('statusMsg').classList.add('text-red-600');
      }
    }

    // 底部導覽列切換邏輯
    function switchTab(tabName) {
      // 隱藏所有視圖
      document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
      // 顯示目標視圖
      document.getElementById(`view-${tabName}`).classList.remove('hidden');
      
      // 更新底部導覽列的顏色狀態
      ['profile', 'checkin', 'events'].forEach(id => {
        const btn = document.getElementById(`tab-${id}`);
        if (id === tabName) {
          btn.classList.remove('text-gray-400');
          btn.classList.add('text-blue-700');
        } else {
          btn.classList.remove('text-blue-700');
          btn.classList.add('text-gray-400');
        }
      });
    }

    // 將活動資料渲染到畫面上
    function renderEventsData() {
      // 1. 處理活動預告頁面
      const eventsContainer = document.getElementById('eventsContainer');
      eventsContainer.innerHTML = '';
      
      EVENTS_DB.forEach(evt => {
        eventsContainer.innerHTML += `
          <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
            <h3 class="text-lg font-bold text-gray-800 mb-2">${evt.title}</h3>
            <div class="text-sm text-gray-600 mb-1">🕒 ${evt.date}</div>
            <div class="text-sm text-gray-600 mb-3">📍 ${evt.location}</div>
            <p class="text-sm text-gray-500 leading-relaxed bg-gray-50 p-3 rounded">${evt.description}</p>
          </div>
        `;
      });

      // 2. 處理報到頁面
      const activeEvent = EVENTS_DB.find(e => e.isActive) || EVENTS_DB[0];
      document.getElementById('activeEventTitle').innerText = activeEvent.title;
      document.getElementById('activeEventDate').innerText = activeEvent.date;
      
      // 將目前的 activeEvent 暫存，供報到按鈕驗證使用
      window.currentActiveEvent = activeEvent;

      const otherList = document.getElementById('otherEventsList');
      otherList.innerHTML = '';
      EVENTS_DB.filter(e => e.id !== activeEvent.id).forEach(evt => {
        otherList.innerHTML += `<li class="py-2 text-sm text-gray-700 flex items-center before:content-['•'] before:text-blue-500 before:mr-2">${evt.title}</li>`;
      });
    }

    // 處理報到邏輯與屆數驗證
    async function handleCheckIn() {
      // 獲取使用者輸入的屆數 (未來這會從 GAS 資料庫撈取綁定資料)
      const userCohortInput = document.getElementById('userCohort').value;
      const userCohort = parseInt(userCohortInput, 10);
      const activeEvent = window.currentActiveEvent;

      // 檢查使用者是否填寫屆數
      if (isNaN(userCohort)) {
        alert("⚠️ 請先至「會員資料」頁面填寫您的畢業屆數，系統才能判定報到權限。");
        switchTab('profile');
        return;
      }

      // 檢查屆數權限限制
      if (activeEvent.targetCohorts !== 'all') {
        if (!activeEvent.targetCohorts.includes(userCohort)) {
          alert(`⛔ 報到失敗\n\n此活動 (${activeEvent.title}) 僅限第 ${activeEvent.targetCohorts.join(', ')} 屆校友報到。\n您的屆數為：${userCohort} 屆。`);
          return;
        }
      }

      // 通過權限審查，彈出防呆確認
      if(!confirm("⚠️ 系統提示\n\n您即將進行活動報到。\n請確認您是工作人員，是否繼續執行？")) {
        return;
      }
      
      alert("✅ 驗證成功！\n\n(未來這裡會將 LINE ID 傳送至 GAS 寫入報到資料庫)");
    }

    // 儲存會員資料 (測試用)
    function saveProfile() {
      alert("資料已暫存。\n\n下一步我們會建構 GAS 接收資料庫的 API。");
    }

    window.onload = initializeApp;
  </script>
</body>
</html>
