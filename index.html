<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>中華民國臺中一中校友總會</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { padding-bottom: 70px; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-gray-800">

  <header class="bg-blue-900 text-white p-3 shadow-md sticky top-0 z-50 flex items-center gap-3">
    <img src="logo2.jpg" alt="校友總會 Logo" class="h-10 w-10 object-contain bg-white rounded-full p-0.5">
    <h1 class="text-[17px] font-bold tracking-wider">中華民國臺中一中校友總會</h1>
  </header>

  <div id="loadingView" class="fixed inset-0 bg-white/80 z-40 flex flex-col items-center justify-center backdrop-blur-sm">
    <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-900 border-t-transparent mb-4"></div>
    <p id="statusMsg" class="text-blue-900 font-bold">系統連線中，請稍候...</p>
  </div>

  <div id="adminModal" class="fixed inset-0 bg-black/60 z-50 hidden flex flex-col items-center justify-center px-4">
    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-sm border-t-4 border-slate-800">
      <h3 class="text-xl font-bold text-slate-800 mb-2">🔐 管理員身分驗證</h3>
      <input type="password" id="adminPwd" class="w-full border p-3 rounded-lg outline-none mb-4" placeholder="請輸入密碼">
      <div class="flex gap-3">
        <button onclick="skipAdmin()" class="w-1/2 bg-gray-200 text-gray-700 font-bold py-2 rounded-lg">跳過</button>
        <button onclick="verifyAdminPwd()" class="w-1/2 bg-slate-800 text-white font-bold py-2 rounded-lg">確認解鎖</button>
      </div>
      <p id="pwdErrorMsg" class="text-red-500 text-sm mt-3 hidden text-center font-bold">❌ 密碼錯誤</p>
    </div>
  </div>

  <div class="max-w-md mx-auto p-4">

    <!-- 視圖 1：校友及會員資料 -->
    <div id="view-profile" class="view-section hidden">
      
      <!-- 個人名片區 -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 mb-4 bg-gradient-to-br from-white to-blue-50">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-lg font-bold text-blue-900">校友資訊卡</h2>
          <span id="displayRole" class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded">一般會員(校友)</span>
        </div>
        <div class="space-y-2 text-sm text-gray-700">
          <div class="flex justify-between"><span class="text-gray-500 font-semibold">真實姓名</span><span id="cardName" class="font-bold">尚未設定</span></div>
          <div class="flex justify-between"><span class="text-gray-500 font-semibold">專屬代碼</span><span id="cardUniqueId" class="font-mono font-bold tracking-wider text-blue-700">尚未產生</span></div>
          <div class="flex justify-between"><span class="text-gray-500 font-semibold">聯絡電話</span><span id="cardPhone" class="font-mono">尚未設定</span></div>
          <div class="flex justify-between"><span class="text-gray-500 font-semibold">在學學號</span><span id="cardStudentId" class="font-mono">未提供</span></div>
          <div class="flex justify-between"><span class="text-gray-500 font-semibold">聯絡地址</span><span id="cardAddress" class="text-right w-2/3 truncate">未提供</span></div>
        </div>
      </div>
      
      <!-- 第一層表單：基本資料 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-4">
        <h3 class="text-md font-bold text-gray-800 mb-4 border-b pb-2">✏️ 更新會員資料</h3>
        <form class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div><label class="block text-sm font-semibold text-gray-600 mb-1">真實姓名 <span class="text-red-500">*</span></label><input type="text" id="userName" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
            <div><label class="block text-sm font-semibold text-gray-600 mb-1">性別 <span class="text-red-500">*</span></label><select id="userGender" class="w-full border border-gray-300 p-2 rounded-lg bg-white"><option value="男" selected>男</option><option value="女">女</option><option value="其他">其他</option></select></div>
          </div>
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">畢業屆數 <span class="text-red-500">*</span></label><select id="userCohort" onchange="updateUniqueIdPreview()" class="w-full border border-gray-300 p-2 rounded-lg bg-white"></select></div>
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">聯絡電話 <span class="text-red-500">*</span></label><input type="tel" id="userPhone" oninput="updateUniqueIdPreview()" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="例如：0912345678"></div>
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">在學學號 <span class="text-xs text-gray-400 font-normal">(選填)</span></label><input type="text" id="userStudentId" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
          
          <button type="button" onclick="saveBasicProfile()" id="saveBasicBtn" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-lg shadow mt-2 transition">儲存基本資料</button>
        </form>
      </div>

      <!-- 第二層表單：進階資料 (折疊) -->
      <div class="border border-gray-200 rounded-lg overflow-hidden mb-4 shadow-sm bg-white">
        <button type="button" onclick="toggleAdvanced()" class="w-full bg-gray-50 hover:bg-gray-100 text-gray-700 text-sm font-bold p-4 flex justify-between items-center focus:outline-none transition">
          <span>➕ 展開填寫更多進階資料 (選填)</span>
          <span id="advToggleIcon">▼</span>
        </button>
        <div id="advancedFields" class="hidden p-5 space-y-4 border-t border-gray-200">
          <p class="text-xs text-gray-500 mb-2">提供詳細資料有助於理監事及校友會的緊密聯繫，本區資料將加密存放於第二層專屬資料庫。</p>
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">電子信箱</label><input type="email" id="userEmail" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">聯絡地址</label><input type="text" id="userAddress" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">服務產業</label><input type="text" id="userIndustry" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
          
          <!-- 將服務單位與職稱拆分 -->
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">服務單位</label><input type="text" id="userCompany" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
          <div><label class="block text-sm font-semibold text-gray-600 mb-1">職稱</label><input type="text" id="userJobTitle" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
          
          <button type="button" onclick="saveDetailProfile()" id="saveDetailBtn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg shadow mt-2 transition">儲存進階詳細資料</button>
        </div>
      </div>
      
      <button id="adminEntryBtn" onclick="switchTab('admin')" class="hidden w-full bg-slate-800 text-white font-bold py-3 rounded-lg shadow transition">⚙️ 進入管理員後台</button>
    </div>

    <div id="view-admin" class="view-section hidden"><div class="bg-white p-6 rounded-xl border border-slate-200"><h2 class="text-xl font-bold mb-4">⚙️ 建立新活動</h2><button class="w-full bg-slate-800 text-white py-3 rounded-lg">建立</button></div></div>
    <div id="view-checkin" class="view-section hidden"><div class="bg-white p-5 rounded-xl border border-blue-100"><h2 class="text-2xl font-bold mb-5">活動報到</h2><button class="w-full bg-red-600 text-white py-6 rounded-2xl shadow-lg border-4 border-red-200 flex flex-col items-center justify-center transition transform active:scale-95"><span class="text-3xl font-extrabold mb-1">✅ 報到</span></button></div></div>
    <div id="view-events" class="view-section hidden"><h2 class="text-xl font-bold text-blue-900 mb-4 px-1">活動預告</h2></div>
  </div>

  <nav class="fixed bottom-0 w-full bg-white border-t flex justify-around items-center h-[65px] z-50 pb-2">
    <button onclick="switchTab('profile')" class="flex flex-col items-center justify-center w-1/3 text-blue-700" id="tab-profile"><span class="text-xl mb-1">👤</span><span class="text-[10px] font-bold">會員資料</span></button>
    <button onclick="switchTab('checkin')" class="flex flex-col items-center justify-center w-1/3 text-gray-400" id="tab-checkin"><span class="text-xl mb-1">✅</span><span class="text-[10px] font-bold">活動報到</span></button>
    <button onclick="switchTab('events')" class="flex flex-col items-center justify-center w-1/3 text-gray-400" id="tab-events"><span class="text-xl mb-1">📅</span><span class="text-[10px] font-bold">活動預告</span></button>
  </nav>

  <script>
    const MY_LIFF_ID = "2011351908-6yan9QMs"; 
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyxmqsLVqwOt9TIZdc3nwlq3_JWTijuEgChhBmgasraHTGtxwpoEm2lL_q-QdSIUYW4Wg/exec"; 
    let currentUserLineId = "";

    function maskPhone(phone) { 
      if (!phone) return "尚未設定";
      let pStr = phone.toString();
      if (pStr.length === 9 && !pStr.startsWith('0')) pStr = '0' + pStr;
      if (pStr.length >= 10) return pStr.substring(0, 2) + "***" + pStr.slice(-5);
      return pStr; 
    }

    function maskAddress(addr) { return (!addr) ? "未提供" : (addr.length <= 6 ? addr : addr.substring(0, 5) + "***" + addr.substring(addr.length - 3)); }
    
    function toggleAdvanced() {
      const advBox = document.getElementById('advancedFields');
      const icon = document.getElementById('advToggleIcon');
      if (advBox.classList.contains('hidden')) { advBox.classList.remove('hidden'); icon.innerText = "▲"; } 
      else { advBox.classList.add('hidden'); icon.innerText = "▼"; }
    }

    function generateCohortOptions() {
      const select = document.getElementById('userCohort');
      const currentCohort = new Date().getFullYear() - 1939; 
      for (let i = 1; i <= 120; i++) {
        const option = document.createElement('option');
        option.value = i;
        option.text = `第 ${i} 屆 (民國 ${i+28} 年 / 西元 ${i+1939} 年)`;
        if (i === currentCohort) option.selected = true;
        select.appendChild(option);
      }
    }

    function updateUniqueIdPreview() {
      const cohort = document.getElementById('userCohort').value;
      let phone = document.getElementById('userPhone').value;
      const display = document.getElementById('cardUniqueId');
      
      if (cohort && phone && phone.length >= 5) {
        const last5 = phone.slice(-5);
        display.innerText = `${cohort}-${last5}`;
        display.classList.replace('text-slate-700', 'text-blue-700');
      } else {
        display.innerText = "尚未產生 (請輸入完整電話)";
        display.classList.replace('text-blue-700', 'text-slate-700');
      }
    }

    async function initializeApp() {
      generateCohortOptions(); 
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (liff.isLoggedIn()) {
          currentUserLineId = (await liff.getProfile()).userId;
          checkUserData(currentUserLineId);
        } else liff.login();
      } catch (err) { document.getElementById('statusMsg').innerText = "系統初始化失敗：" + err.message; }
    }

    async function checkUserData(lineId) {
      document.getElementById('statusMsg').innerText = "正在讀取資料...";
      try {
        const response = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'checkUser', lineUserId: lineId }) });
        const result = await response.json();
        document.getElementById('loadingView').classList.add('hidden');
        
        if (result.profile) {
          document.getElementById('userName').value = result.profile.name;
          document.getElementById('userGender').value = result.profile.gender || "男";
          document.getElementById('userCohort').value = result.profile.cohort;
          document.getElementById('userPhone').value = result.profile.phone;
          document.getElementById('userStudentId').value = result.profile.studentId || "";
          
          document.getElementById('userEmail').value = result.profile.email || "";
          document.getElementById('userAddress').value = result.profile.address || "";
          document.getElementById('userIndustry').value = result.profile.industry || "";
          document.getElementById('userCompany').value = result.profile.company || "";
          document.getElementById('userJobTitle').value = result.profile.jobTitle || ""; // 填入職稱
          
          document.getElementById('cardName').innerText = `${result.profile.name} (${result.profile.gender || "男"})`;
          document.getElementById('cardUniqueId').innerText = result.profile.uniqueId || "尚未產生";
          document.getElementById('displayRole').innerText = result.profile.role;
          document.getElementById('cardPhone').innerText = maskPhone(result.profile.phone);
          document.getElementById('cardStudentId').innerText = result.profile.studentId || "未提供";
          document.getElementById('cardAddress').innerText = maskAddress(result.profile.address);
        }
        
        if (result.status === 'success' && result.isAdmin) { document.getElementById('adminModal').classList.remove('hidden'); } 
        else { switchTab('profile'); }
      } catch (err) { document.getElementById('loadingView').classList.add('hidden'); switchTab('profile'); }
    }

    async function saveBasicProfile() {
      const name = document.getElementById('userName').value;
      const cohort = document.getElementById('userCohort').value;
      const phone = document.getElementById('userPhone').value;
      
      if (!name || !cohort || !phone) { alert("請完整填寫姓名、畢業屆數與聯絡電話 (此為必填)。"); return; }

      const btn = document.getElementById('saveBasicBtn');
      btn.disabled = true; btn.innerText = "資料儲存中...";

      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'saveBasicProfile',
            lineUserId: currentUserLineId,
            name: name, gender: document.getElementById('userGender').value,
            cohort: cohort, phone: phone, 
            studentId: document.getElementById('userStudentId').value
          })
        });
        const result = await response.json();
        if (result.status === 'success') { 
          alert("✅ 基本資料儲存成功！"); 
          checkUserData(currentUserLineId); 
        } else {
          throw new Error(result.message);
        }
      } catch (error) { 
        alert("❌ 儲存失敗：" + error.message); 
      } finally { 
        btn.disabled = false; btn.innerText = "儲存基本資料"; 
      }
    }

    async function saveDetailProfile() {
      if (!document.getElementById('userName').value) { alert("請先完成並儲存上方的「基本會員資料」。"); return; }
      const btn = document.getElementById('saveDetailBtn');
      btn.disabled = true; btn.innerText = "進階資料儲存中...";

      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'saveDetailProfile',
            lineUserId: currentUserLineId,
            email: document.getElementById('userEmail').value,
            address: document.getElementById('userAddress').value,
            industry: document.getElementById('userIndustry').value,
            company: document.getElementById('userCompany').value,
            jobTitle: document.getElementById('userJobTitle').value // 拋送職稱
          })
        });
        const result = await response.json();
        if (result.status === 'success') { 
          alert("✅ 進階詳細資料已安全寫入第二層資料庫！"); 
          checkUserData(currentUserLineId); 
        } else {
          throw new Error(result.message);
        }
      } catch (error) { 
        alert("❌ 儲存失敗：" + error.message); 
      } finally { 
        btn.disabled = false; btn.innerText = "儲存進階詳細資料"; 
      }
    }

    function verifyAdminPwd() { if (document.getElementById('adminPwd').value === "tcfsh01") { document.getElementById('adminModal').classList.add('hidden'); switchTab('admin'); document.getElementById('adminEntryBtn').classList.remove('hidden'); } else { document.getElementById('pwdErrorMsg').classList.remove('hidden'); } }
    function skipAdmin() { document.getElementById('adminModal').classList.add('hidden'); switchTab('profile'); }
    function switchTab(tabName) { document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden')); document.getElementById(`view-${tabName}`).classList.remove('hidden'); ['profile', 'checkin', 'events'].forEach(id => { const btn = document.getElementById(`tab-${id}`); if(btn) btn.classList.replace(id === tabName || (id === 'profile' && tabName === 'admin') ? 'text-gray-400' : 'text-blue-700', id === tabName || (id === 'profile' && tabName === 'admin') ? 'text-blue-700' : 'text-gray-400'); }); }
    
    document.getElementById('userCohort').addEventListener('change', updateUniqueIdPreview);
    document.getElementById('userPhone').addEventListener('input', updateUniqueIdPreview);

    window.onload = initializeApp;
  </script>
</body>
</html>
